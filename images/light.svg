    <style>
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      @keyframes fadeIn { from{opacity:0} to{opacity:1} }
      @keyframes typing { from{width:0} to{width:100%} }
      @keyframes shimmer { 0%{stop-color:#7C3AED} 33%{stop-color:#22D3EE} 66%{stop-color:#10B981} 100%{stop-color:#7C3AED} }
      @keyframes gradshift { 0%{x1:0%;y1:0%} 50%{x1:100%;y1:100%} 100%{x1:0%;y1:0%} }
      @keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
      .cursor { animation: blink 1s step-end infinite; }
      .float { animation: float 4s ease-in-out infinite; }
      .fadein1 { opacity:0; animation: fadeIn 0.5s ease forwards; animation-delay: 0.3s; }
      .fadein2 { opacity:0; animation: fadeIn 0.5s ease forwards; animation-delay: 0.8s; }
      .fadein3 { opacity:0; animation: fadeIn 0.5s ease forwards; animation-delay: 1.3s; }
      .fadein4 { opacity:0; animation: fadeIn 0.5s ease forwards; animation-delay: 1.8s; }
      .fadein5 { opacity:0; animation: fadeIn 0.5s ease forwards; animation-delay: 2.3s; }
      .fadein6 { opacity:0; animation: fadeIn 0.5s ease forwards; animation-delay: 2.8s; }
      .fadein7 { opacity:0; animation: fadeIn 0.5s ease forwards; animation-delay: 3.3s; }
      .fadein8 { opacity:0; animation: fadeIn 0.5s ease forwards; animation-delay: 3.8s; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>

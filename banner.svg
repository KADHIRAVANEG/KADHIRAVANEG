<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif">
  <!-- base -->
  <rect x="0" y="0" width="1200" height="280" fill="#F2EEE3"/>

  <!-- offset hard-shadow behind main panel -->
  <rect x="30" y="30" width="1140" height="222" fill="#0A0A0A"/>
  <rect x="20" y="20" width="1140" height="222" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/>

  <!-- accent corner block, top-left -->
  <rect x="20" y="20" width="140" height="42" fill="#FFDE59" stroke="#0A0A0A" stroke-width="4"/>
  <text x="90" y="47" font-size="14" fill="#0A0A0A" text-anchor="middle" letter-spacing="1" font-weight="900">WHOAMI</text>

  <!-- accent corner block, top-right: status -->
  <rect x="982" y="20" width="178" height="42" fill="#4FD1C5" stroke="#0A0A0A" stroke-width="4"/>
  <text x="1071" y="46" font-size="14" fill="#0A0A0A" text-anchor="middle" font-weight="900" letter-spacing="0.5">SECURITY ENGINEER</text>

  <!-- name -->
  <text x="48" y="110" font-size="38" fill="#0A0A0A" font-weight="900" letter-spacing="0.3">KADHIRAVAN E G</text>

  <!-- underline bar -->
  <rect x="50" y="120" width="300" height="8" fill="#FF5A36" stroke="#0A0A0A" stroke-width="3"/>

  <!-- subtitle -->
  <text x="50" y="150" font-size="14" fill="#0A0A0A" font-weight="700" letter-spacing="0.3">B.E. CYBER SECURITY // FULL-STACK &amp; SYSTEMS ENGINEER</text>

  <!-- tag chips -->
  <g font-size="11.5" font-weight="900" letter-spacing="0.4">
    <rect x="50" y="160" width="112" height="26" fill="#FFDE59" stroke="#0A0A0A" stroke-width="3"/>
    <text x="106" y="177" fill="#0A0A0A" text-anchor="middle">SECURE CODE</text>

    <rect x="172" y="160" width="128" height="26" fill="#FF5A36" stroke="#0A0A0A" stroke-width="3"/>
    <text x="236" y="177" fill="#0A0A0A" text-anchor="middle">VULN ASSESS</text>

    <rect x="310" y="160" width="98" height="26" fill="#4FD1C5" stroke="#0A0A0A" stroke-width="3"/>
    <text x="359" y="177" fill="#0A0A0A" text-anchor="middle">LINUX</text>

    <rect x="418" y="160" width="80" height="26" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
    <text x="458" y="177" fill="#0A0A0A" text-anchor="middle">CTF</text>
  </g>

  <!-- flat geometric shield icon, right side -->
  <g transform="translate(700,72) scale(0.72)">
    <rect x="0" y="0" width="90" height="90" fill="#FFDE59" stroke="#0A0A0A" stroke-width="4" transform="rotate(6 45 45)"/>
    <polygon points="45,6 90,26 90,58 45,84 0,58 0,26" fill="#F2EEE3" stroke="#0A0A0A" stroke-width="4"/>
    <path d="M30 40 L41 51 L62 28" stroke="#0A0A0A" stroke-width="6" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- divider -->
  <line x1="20" y1="196" x2="1160" y2="196" stroke="#0A0A0A" stroke-width="4"/>

  <!-- bottom row: quick-fact blocks -->
  <g font-weight="900">
    <text x="50" y="212" font-size="10" fill="#7A7568" letter-spacing="1">BASE</text>
    <text x="50" y="232" font-size="14" fill="#0A0A0A">COIMBATORE, IN</text>

    <text x="290" y="212" font-size="10" fill="#7A7568" letter-spacing="1">ROLE</text>
    <text x="290" y="232" font-size="14" fill="#0A0A0A">SYSTEM UX ENGINEER</text>

    <text x="580" y="212" font-size="10" fill="#7A7568" letter-spacing="1">GITHUB</text>
    <text x="580" y="232" font-size="14" fill="#0A0A0A">@KADHIRAVANEG</text>

    <text x="860" y="212" font-size="10" fill="#7A7568" letter-spacing="1">CTF / PLATFORMS</text>
    <text x="860" y="232" font-size="14" fill="#0A0A0A">@JOKER53</text>
  </g>

  <!-- bottom-right status pill -->
  <rect x="982" y="206" width="178" height="30" fill="#0A0A0A"/>
  <circle cx="1002" cy="221" r="5" fill="#4FD1C5"/>
  <text x="1080" y="225" font-size="11" fill="#F2EEE3" text-anchor="middle" font-weight="900" letter-spacing="0.5">OPEN TO WORK</text>
</svg>

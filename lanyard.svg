<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 660" width="420" height="660" role="img" aria-label="Kadhiravan ID card lanyard">
<title>Kadhiravan — swinging ID badge</title>
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes settle{0%{transform:rotate(0deg) translateY(-660px)}18%{transform:rotate(0deg) translateY(0)}30%{transform:rotate(13deg)}46%{transform:rotate(-9deg)}62%{transform:rotate(6deg)}78%{transform:rotate(-3.5deg)}92%{transform:rotate(1.5deg)}100%{transform:rotate(0deg)}}
@keyframes sway{0%,100%{transform:rotate(-3.2deg)}50%{transform:rotate(3.2deg)}}
@keyframes cardWobble{0%,100%{transform:rotate(1.6deg)}50%{transform:rotate(-1.6deg)}}
@keyframes shine{0%{transform:translateX(-340px) skewX(-18deg)}55%,100%{transform:translateX(420px) skewX(-18deg)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}12%{transform:scale(1.25)}24%{transform:scale(1)}36%{transform:scale(1.15)}48%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scanline{0%{transform:translateY(-10px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(340px);opacity:0}}
.settle{transform-origin:210px 6px;animation:settle 3.4s cubic-bezier(.34,1.1,.5,1) forwards}
.sway{transform-origin:210px 6px;animation:sway 4.2s ease-in-out 3.4s infinite}
.wob{transform-origin:210px 300px;animation:cardWobble 4.2s ease-in-out 3.4s infinite}
.shine{animation:shine 4.5s ease-in-out 3.6s infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.8s ease-in-out infinite}
.pb{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
.scan{animation:scanline 3s ease-in-out 4s infinite}
]]></style>

<!-- Strap gradient: cyan -->
<linearGradient id="strapg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#0d7a6e"/><stop offset="50%" stop-color="#64ffda"/><stop offset="100%" stop-color="#0d7a6e"/>
</linearGradient>

<!-- Card body gradient: dark navy -->
<linearGradient id="cardg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0a192f"/><stop offset="100%" stop-color="#020c1b"/>
</linearGradient>

<!-- Animated card border: cyan to teal -->
<linearGradient id="cardborder" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%"><animate attributeName="stop-color" values="#64ffda;#00b4d8;#0d7a6e;#64ffda" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#0d7a6e;#64ffda;#00b4d8;#0d7a6e" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>

<!-- Metal clasp -->
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#c8ccd6"/><stop offset="45%" stop-color="#8a90a0"/><stop offset="55%" stop-color="#6a7080"/><stop offset="100%" stop-color="#9aa0b0"/>
</linearGradient>

<!-- Shine sweep -->
<linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#64ffda" stop-opacity="0"/><stop offset="50%" stop-color="#64ffda" stop-opacity=".10"/><stop offset="100%" stop-color="#64ffda" stop-opacity="0"/>
</linearGradient>

<!-- Name gradient: animated cyan -->
<linearGradient id="nameg2" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#64ffda;#00b4d8;#64ffda" dur="5s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#00b4d8;#64ffda;#00b4d8" dur="5s" repeatCount="indefinite"/></stop>
</linearGradient>

<!-- Glow halo: cyan -->
<radialGradient id="lglow"><stop offset="0%" stop-color="#64ffda" stop-opacity=".12"/><stop offset="100%" stop-color="#64ffda" stop-opacity="0"/></radialGradient>

<filter id="glow2"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
<clipPath id="cardclip"><rect x="82" y="298" width="256" height="330" rx="20"/></clipPath>
</defs>

<!-- Ambient glow behind card -->
<circle cx="210" cy="440" r="230" fill="url(#lglow)"><animate attributeName="r" values="230;250;230" dur="5s" repeatCount="indefinite"/></circle>

<!-- Decorative sparkles: cyan tones -->
<g class="tw" style="animation-delay:.5s"><path d="M60 200l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#64ffda"/></g>
<g class="tw" style="animation-delay:1.6s"><path d="M372 300l2.4 6.4 6.4 2.4-6.4 2.4-2.4 6.4-2.4-6.4-6.4-2.4 6.4-2.4z" fill="#00b4d8"/></g>
<g class="tw" style="animation-delay:2.7s"><path d="M52 480l2.4 6.4 6.4 2.4-6.4 2.4-2.4 6.4-2.4-6.4-6.4-2.4 6.4-2.4z" fill="#64ffda"/></g>

<!-- Pulsing shield icon (instead of heart) -->
<g class="pb" style="animation-delay:1s" filter="url(#glow2)">
  <path d="M368 466 L358 470 L358 480 C358 488 363 493 368 496 C373 493 378 488 378 480 L378 470 Z" fill="#64ffda" opacity=".8"/>
  <rect x="364" y="477" width="8" height="6" rx="1" fill="#020c1b"/>
  <path d="M366 477 L366 474 C366 471 370 471 370 474 L370 477" fill="none" stroke="#020c1b" stroke-width="1.2"/>
</g>

<!-- Main pendulum group -->
<g class="settle"><g class="sway">

  <!-- Strap -->
  <g>
    <path d="M191 -6 L229 -6 L226 236 L194 236 Z" fill="url(#strapg)"/>
    <line x1="196" y1="0" x2="198.5" y2="234" stroke="#fff" stroke-opacity=".45" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="224" y1="0" x2="221.5" y2="234" stroke="#fff" stroke-opacity=".45" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="0" y="0" font-size="10.5" font-weight="bold" fill="#020c1b" opacity=".85" letter-spacing="2" transform="translate(214,18) rotate(90)">KADHIRAVAN ♦ SEC-OPS ♦ KADHIRAVAN</text>
  </g>

  <!-- Metal clasp + ring -->
  <rect x="188" y="232" width="44" height="26" rx="6" fill="url(#metal)" stroke="#4a4f5c" stroke-width="1"/>
  <rect x="199" y="238" width="22" height="7" rx="3.5" fill="#3c414e"/>
  <circle cx="210" cy="272" r="14" fill="none" stroke="url(#metal)" stroke-width="5.5"/>

  <!-- Card body (secondary wobble) -->
  <g class="wob">
    <rect x="82" y="298" width="256" height="330" rx="20" fill="url(#cardg)" stroke="url(#cardborder)" stroke-width="2" filter="url(#cardShadow)"/>

    <!-- Card slot at top -->
    <rect x="180" y="310" width="60" height="10" rx="5" fill="#020c1b" stroke="#0d3349" stroke-width="1"/>

    <g clip-path="url(#cardclip)">

      <!-- Header band -->
      <rect x="82" y="298" width="256" height="34" fill="#0d1f35" opacity=".9"/>

      <!-- Subtle scanline effect -->
      <rect class="scan" x="82" y="298" width="256" height="2" fill="#64ffda" opacity=".06"/>

      <!-- Grid dots pattern -->
      <g opacity=".04" fill="#64ffda">
        <circle cx="100" cy="320" r="1"/><circle cx="120" cy="320" r="1"/><circle cx="140" cy="320" r="1"/>
        <circle cx="280" cy="320" r="1"/><circle cx="300" cy="320" r="1"/><circle cx="320" cy="320" r="1"/>
      </g>

      <text x="98" y="319" font-size="9" fill="#64ffda" opacity=".7" letter-spacing="1.5">CYBER SEC ID</text>
      <text x="322" y="319" text-anchor="end" font-size="9" fill="#00b4d8" letter-spacing="1.5">JOKER-53</text>

      <!-- Corner brackets on header -->
      <g stroke="#64ffda" stroke-width="1.2" fill="none" opacity=".5">
        <path d="M88,332 L88,304 L100,304"/>
        <path d="M322,304 L334,304 L334,332"/>
      </g>

      <!-- Avatar circle with animated border -->
      <circle cx="210" cy="412" r="59" fill="none" stroke="url(#cardborder)" stroke-width="2.5"/>
      <circle cx="210" cy="412" r="55" fill="#0d1f35" opacity=".6"/>

      <!-- Photo from repo -->
      <image x="154" y="356" width="112" height="112"
             href="https://github.com/KADHIRAVANEG/KADHIRAVANEG/raw/main/images/profile.png"
             preserveAspectRatio="xMidYMid slice"
             clip-path="url(#cardclip)"/>

      <!-- Scan ring animation over avatar -->
      <circle cx="210" cy="412" r="59" fill="none" stroke="#64ffda" stroke-width="1" opacity=".3">
        <animate attributeName="r" values="45;62;45" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".4;0;.4" dur="3s" repeatCount="indefinite"/>
      </circle>

      <!-- Name in cyan gradient — "Kadhiravan" styled text -->
      <text x="210" y="500" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#nameg2)" filter="url(#glow2)" letter-spacing="1">Kadhiravan</text>

      <!-- Role -->
      <text x="210" y="520" text-anchor="middle" font-size="11" fill="#64ffda" font-weight="bold" letter-spacing="2">CYBERSECURITY ENGINEER</text>
      <text x="210" y="536" text-anchor="middle" font-size="10.5" fill="#8892b0">@KADHIRAVANEG</text>

      <!-- Divider -->
      <line x1="100" y1="548" x2="320" y2="548" stroke="#0d3349" stroke-width="1"/>

      <!-- Info rows -->
      <text x="98" y="562" font-size="9.5" fill="#64ffda" opacity=".8">🎓</text>
      <text x="113" y="562" font-size="9.5" fill="#8892b0">B.E. Cyber Security</text>

      <text x="98" y="578" font-size="9.5" fill="#64ffda" opacity=".8">🏆</text>
      <text x="113" y="578" font-size="9.5" fill="#8892b0">TryHackMe · JOKER53</text>

      <!-- Barcode -->
      <g transform="translate(100,590)">
        <rect x="0" y="0" width="2.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="5" y="0" width="1.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="9" y="0" width="1.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="12" y="0" width="1.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="16" y="0" width="4" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="21.5" y="0" width="1.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="26" y="0" width="4" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="31.5" y="0" width="1.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="34.5" y="0" width="4" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="41" y="0" width="1.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="45.5" y="0" width="2.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="50.5" y="0" width="1.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="54.5" y="0" width="1.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="58.5" y="0" width="2.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="63.5" y="0" width="2.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="67.5" y="0" width="1.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="72" y="0" width="1.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="76.5" y="0" width="1.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="81" y="0" width="1.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="84" y="0" width="2.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="89" y="0" width="1.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="93.5" y="0" width="4" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="100" y="0" width="2" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="104" y="0" width="1.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="108" y="0" width="3" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="113" y="0" width="1.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="116.5" y="0" width="2.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="121.5" y="0" width="1.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="125" y="0" width="3" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="130" y="0" width="1.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="134" y="0" width="2" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="138.5" y="0" width="4" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="145" y="0" width="1.5" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="149" y="0" width="2" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="154" y="0" width="3" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="159" y="0" width="1" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="163" y="0" width="3" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="168" y="0" width="2" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="172.5" y="0" width="1" height="22" fill="#64ffda" opacity=".7"/>
        <rect x="176" y="0" width="2" height="22" fill="#64ffda" opacity=".7"/>
      </g>

      <!-- Tech tags bottom right -->
      <text x="322" y="602" text-anchor="end" font-size="8.5" fill="#64ffda" opacity=".6">Python • Linux</text>
      <text x="322" y="614" text-anchor="end" font-size="8.5" fill="#64ffda" opacity=".6">Burp • Nmap</text>

      <!-- Holo shine sweep (cyan tinted) -->
      <rect class="shine" x="82" y="288" width="120" height="360" fill="url(#shineg)"/>

    </g>
  </g>
</g></g>

<!-- Bottom hint text -->
<text x="210" y="652" text-anchor="middle" font-size="10" fill="#8892b0" opacity="0" style="animation:fadeIn .6s ease 3.6s forwards">— I use Arch btw... and this is an SVG ⚡ —</text>
</svg>

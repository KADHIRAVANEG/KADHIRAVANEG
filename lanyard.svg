<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 720" width="420" height="720" role="img" aria-label="Kadhiravan ID card — neo-brutalist">
<title>Kadhiravan — swinging ID badge</title>
<defs>
<style type="text/css"><![CDATA[
text{font-family:'Arial Black','Helvetica Neue',Arial,sans-serif}
@keyframes settle{0%{transform:rotate(0deg) translateY(-720px)}18%{transform:rotate(0deg) translateY(0)}30%{transform:rotate(12deg)}46%{transform:rotate(-8deg)}62%{transform:rotate(5deg)}78%{transform:rotate(-3deg)}92%{transform:rotate(1.2deg)}100%{transform:rotate(0deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes cardWobble{0%,100%{transform:rotate(1.3deg)}50%{transform:rotate(-1.3deg)}}
.settle{transform-origin:210px 6px;animation:settle 3.4s cubic-bezier(.34,1.1,.5,1) forwards}
.sway{transform-origin:210px 6px;animation:sway 4.2s ease-in-out 3.4s infinite}
.wob{transform-origin:210px 330px;animation:cardWobble 4.2s ease-in-out 3.4s infinite}
]]></style>
</defs>

<!-- Full cream background -->
<rect width="420" height="720" fill="#F2EEE3"/>

<!-- Main swinging group -->
<g class="settle">
  <g class="sway">

    <!-- Strap -->
    <path d="M188 -6 L232 -6 L228 248 L192 248 Z" fill="#4FD1C5" stroke="#0A0A0A" stroke-width="5"/>
    <line x1="197" y1="8" x2="199" y2="244" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="223" y1="8" x2="221" y2="244" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="5 4"/>
    <text font-size="11" font-weight="900" fill="#0A0A0A" letter-spacing="1" transform="translate(214,30) rotate(90)">KADHIRAVAN • DEVOPS • JOKER53</text>

    <!-- Clasp -->
    <rect x="186" y="242" width="48" height="28" rx="3" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="5"/>
    <rect x="198" y="249" width="24" height="8" rx="2" fill="#0A0A0A"/>
    <!-- ring -->
    <circle cx="210" cy="284" r="15" fill="none" stroke="#0A0A0A" stroke-width="6"/>
    <circle cx="210" cy="284" r="7" fill="#FFDE59" stroke="#0A0A0A" stroke-width="3"/>

    <!-- Card + shadow -->
    <g class="wob">
      <!-- hard offset shadow -->
      <rect x="94" y="330" width="256" height="340" rx="10" fill="#0A0A0A"/>
      
      <!-- white card -->
      <rect x="82" y="318" width="256" height="340" rx="10" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="6"/>

      <!-- yellow header -->
      <rect x="82" y="318" width="256" height="44" fill="#FFDE59" stroke="#0A0A0A" stroke-width="6"/>
      <text x="100" y="348" font-size="14" font-weight="900" fill="#0A0A0A" letter-spacing="1">  CYBER</text>
      <text x="322" y="348" text-anchor="end" font-size="14" font-weight="900" fill="#0A0A0A">SECURITY  </text>

      <!-- corner accent blocks -->
      <rect x="82" y="318" width="20" height="20" fill="#FF5A36" stroke="#0A0A0A" stroke-width="4"/>
      <rect x="318" y="318" width="20" height="20" fill="#4FD1C5" stroke="#0A0A0A" stroke-width="4"/>

      <!-- Avatar frame -->
      <rect x="148" y="386" width="124" height="124" fill="#F2EEE3" stroke="#0A0A0A" stroke-width="6"/>
      
      <!-- geometric avatar -->
      <rect x="170" y="408" width="80" height="80" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="4"/>
      <circle cx="210" cy="440" r="18" fill="#FFDE59" stroke="#0A0A0A" stroke-width="3"/>
      <path d="M185 478 Q210 458 235 478" fill="none" stroke="#0A0A0A" stroke-width="4" stroke-linecap="square"/>
      
      <!-- colored corner squares -->
      <rect x="148" y="386" width="18" height="18" fill="#FF5A36" stroke="#0A0A0A" stroke-width="3"/>
      <rect x="254" y="386" width="18" height="18" fill="#4FD1C5" stroke="#0A0A0A" stroke-width="3"/>
      <rect x="148" y="492" width="18" height="18" fill="#FFDE59" stroke="#0A0A0A" stroke-width="3"/>
      <rect x="254" y="492" width="18" height="18" fill="#0A0A0A"/>

      <!-- Name -->
      <text x="210" y="546" text-anchor="middle" font-size="22" font-weight="900" fill="#0A0A0A" letter-spacing="0.5">KADHIRAVAN</text>

      <!-- Role chip -->
      <rect x="115" y="558" width="190" height="28" fill="#FF5A36" stroke="#0A0A0A" stroke-width="4"/>
      <text x="210" y="578" text-anchor="middle" font-size="13" font-weight="900" fill="#0A0A0A" letter-spacing="0.8">SECURITY ENGINEER</text>

      <!-- Divider -->
      <rect x="105" y="600" width="210" height="5" fill="#0A0A0A"/>

      <!-- Info - centered @JOKER53 -->
      <text x="210" y="628" text-anchor="middle" font-size="13" font-weight="900" fill="#0A0A0A">B.E. CYBER SECURITY</text>
      <text x="210" y="652" text-anchor="middle" font-size="15" font-weight="900" fill="#0A0A0A">@JOKER53</text>
    </g>
  </g>
</g>

<!-- Bottom text -->
<text x="210" y="700" text-anchor="middle" font-size="15" font-weight="900" fill="#0A0A0A" letter-spacing="1.3">I USE ARCH BTW</text>
</svg>
